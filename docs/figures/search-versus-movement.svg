<svg xmlns="http://www.w3.org/2000/svg" width="630" height="360" viewBox="0 0 630 360" role="img"><title>Search and physical movement</title><rect width="100%" height="100%" fill="#fffefb"/><g font-family="Consolas,monospace" font-size="18" fill="#294a4b"><text x="30" y="28">Conceptual search / not viewer UI</text><rect x="220" y="65" width="170" height="54" rx="4" fill="#ece7d5" stroke="#294a4b"/><text x="305" y="97" text-anchor="middle" font-size="16">Explorer (1,2)</text><rect x="30" y="210" width="170" height="54" rx="4" fill="#ece7d5" stroke="#294a4b"/><text x="115" y="242" text-anchor="middle" font-size="16">North (0,2)</text><rect x="225" y="210" width="170" height="54" rx="4" fill="#ece7d5" stroke="#294a4b"/><text x="310" y="242" text-anchor="middle" font-size="16">South (2,2)</text><rect x="425" y="210" width="170" height="54" rx="4" fill="#ece7d5" stroke="#294a4b"/><text x="510" y="242" text-anchor="middle" font-size="16">East (1,3)</text><path d="M305 119 L115 210" fill="none" stroke="#294a4b" stroke-dasharray="5 4"/><path d="M305 119 L310 210" fill="none" stroke="#294a4b" stroke-dasharray="5 4"/><path d="M305 119 L510 210" fill="none" stroke="#294a4b" stroke-dasharray="5 4"/><text x="30" y="300" font-size="16">Possible frontier entries are private planning data.</text><text x="30" y="328" font-size="16">Only a returned action moves the explorer.</text></g></svg>
